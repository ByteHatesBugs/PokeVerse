<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b1f" />
    <title>PokéVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="universe" aria-label="PokéVerse">
      <div class="aurora" aria-hidden="true"></div>
      <div class="pokeball-pattern" aria-hidden="true"></div>
      <section class="hero-copy" aria-labelledby="hero-title">
        <h1 id="hero-title">PokéVerse</h1>
        <p class="hero-tagline">Every region. Every legend. One universe.</p>
      </section>
      <div class="scroll-cue" aria-label="Scroll to start your journey">
        <span>Scroll to start your journey</span>
        <span class="mouse-icon" aria-hidden="true"><i></i></span>
      </div>
      <div class="ash-entrance">
        <div
          class="ash-greeting"
          role="img"
          aria-label="Ash Ketchum waves hello, then strikes a confident pose"
        >
          <span class="ash-frame ash-frame--1" aria-hidden="true"></span>
          <span class="ash-frame ash-frame--2" aria-hidden="true"></span>
          <span class="ash-frame ash-frame--3" aria-hidden="true"></span>
          <span class="ash-frame ash-frame--4" aria-hidden="true"></span>
          <span class="ash-frame ash-frame--final" aria-hidden="true"></span>
        </div>
      </div>
      <div class="vignette" aria-hidden="true"></div>
    </main>
  </body>
</html>
